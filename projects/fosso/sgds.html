<style>
:root{

  --navy:#0f2756; --navy-2:#1a3a78; --blue:#2f63d6; --blue-2:#6f97e6; --sky:#c9d9f3;
  --ink:#0c1a33; --text:#33415c; --muted:#6f7f9c;
  --ok:#1f9d63; --ok-soft:#e3f5ec; --warn:#e29a18; --warn-soft:#fdf2dc; --warn-ink:#8a5a06;
  --high:#e46c2a; --high-soft:#fde8dc; --high-ink:#963f0f; --crit:#d6384a; --crit-soft:#fbe3e6; --crit-ink:#93202d;

}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--font);color:var(--ink);margin:0;line-height:1.1;letter-spacing:-.025em;text-wrap:balance}

button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* coque : barre latérale marine + zone blanche */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);gap:14px;padding:14px;min-height:100vh;min-height:100dvh}
.side{position:sticky;top:14px;height:calc(100vh - 28px);height:calc(100dvh - 28px);background:var(--navy);border-radius:26px;color:#fff;padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-size:17px;font-weight:600;letter-spacing:-.02em;color:#fff}
.brand .bi{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.brand small{display:block;font-size:11.5px;font-weight:400;color:#a9bde6;letter-spacing:0}
.mi{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#dfe8fb;text-align:left;padding:11px 12px;border-radius:13px;font-size:14px;width:100%;position:relative}
.mi:hover{background:rgba(255,255,255,.07)}
.mi[aria-current="page"]{background:rgba(255,255,255,.15);color:#fff}
.mi .dot{position:absolute;right:12px;top:50%;margin-top:-3.5px;width:7px;height:7px;border-radius:50%;background:#8fb3ff}
.mi .cnt{position:absolute;right:10px;top:50%;margin-top:-9px;background:var(--crit);color:#fff;font-size:10.5px;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

.topbar .sub{color:var(--blue);font-size:13.5px;text-decoration:none;background:none;border:0;padding:0}
.tb-r{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--navy);position:relative}

.icon-btn .cnt{position:absolute;top:-3px;right:-3px;background:var(--crit);color:#fff;font-size:10px;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

@media (max-width:900px){

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.kpi.navy{background:linear-gradient(150deg,#2a5bb8,#0f2756)}.kpi.navy .v{color:#fff}.kpi.navy .meta{color:#cddcff}.kpi.navy .tag{background:rgba(255,255,255,.16);color:#fff}
.fchips{display:flex;gap:6px;flex-wrap:wrap}

.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:20px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

.lvl{display:flex;align-items:center;gap:8px;min-width:120px}
.lvl .tr{flex:1;height:6px;border-radius:3px;background:var(--tint);overflow:hidden}

.overlay{position:fixed;inset:0;background:rgba(12,26,51,.45);display:grid;place-items:center;padding:16px;z-index:40}
.modal{background:#fff;border-radius:26px;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 12px 30px -12px rgba(0,0,0,.4)}

.demo{margin-bottom:16px;background:var(--card-2);border:1px dashed var(--blue-2);border-radius:18px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px}

.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--sky);text-underline-offset:3px}

.pin{cursor:pointer}
.pin:focus-visible{outline:none}.pin:focus-visible circle{stroke:#0f2756;stroke-width:3}

/* Données et règles partagées par l'app ménage et le dashboard SGDS (même clé de stockage : les deux apps se mettent à jour l'une l'autre). */
const H=3600e3,D=24*H;
const SEUILS=[{p:50,name:'Alerte 1',tone:'warn',title:'Fosse à moitié pleine'},{p:75,name:'Alerte 2',tone:'high',title:'Fosse remplie à 75 %'},{p:90,name:'Alerte 3',tone:'crit',title:'Vidange urgente'},{p:100,name:'Fosse pleine',tone:'crit',title:'Risque de débordement'}];
const OPS=['Opérateur agréé A','Opérateur agréé B','Opérateur agréé C','Opérateur agréé D','Opérateur agréé E','Opérateur agréé F'];
const KEY='suivi-fosses-demo-v1';
const SMS_FROM='ALERTE FOSSE';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=n=>Math.round(n).toLocaleString('fr-FR').replace(/[  ]/g,' ');
const fcfa=n=>nf(n)+' FCFA';
const m3=v=>v.toFixed(1).replace('.',',')+' m³';
const tone=l=>l>=90?'crit':l>=75?'high':l>=50?'warn':'ok';
const TC={ok:'#1f9d63',warn:'#e29a18',high:'#e46c2a',crit:'#d6384a'};
const montant=(f,l)=>Math.round((5000+6000*f.volume*(l??f.level)/100)/500)*500;
const dayLbl=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const hm=t=>{const d=new Date(t);return d.getHours()+' h'+(d.getMinutes()?String(d.getMinutes()).padStart(2,'0'):'')};
const ago=t=>{const m=Math.round((Date.now()-t)/60000);if(m<1)return "à l'instant";if(m<60)return 'il y a '+m+' min';const h=Math.round(m/60);return h<24?'il y a '+h+' h':dayLbl(t)};
const left=t=>{const ms=t-Date.now();if(ms<=0)return 'délai dépassé';return Math.floor(ms/H)+' h '+String(Math.floor(ms%H/60000)).padStart(2,'0')+' restantes'};
const slotAt=(d,h)=>{const x=new Date();x.setDate(x.getDate()+d);x.setHours(h,0,0,0);return x.getTime()};
const slotLabel=t=>dayLbl(t)+' · '+hm(t)+' à '+hm(t+2*H);
function slots(){const o=[],n=Date.now();for(let d=0;d<3;d++)for(const h of[8,10,14,16]){const t=slotAt(d,h);if(t>n+H&&t<=n+48*H)o.push(t)}return o}

function seed(){
  const now=Date.now(),mk=o=>Object.assign({sent:{},pay:null,req:null,history:[],battery:80,mine:false},o);
  const payFull=(f,mode,op,ago_)=>{const m=montant(f),base=Math.floor(m/mode/100)*100;f.pay={mode,operator:op,montant:m,tranches:Array.from({length:mode},(_,i)=>({montant:i===mode-1?m-base*(mode-1):base,paid:now-ago_+i*H}))}};
  const payPart=(f,mode,op,nPaid,ago_)=>{payFull(f,mode,op,ago_);f.pay.tranches.forEach((t,i)=>{if(i>=nPaid)t.paid=null})};
  const sentTo=l=>{const s={};SEUILS.forEach(x=>{if(l>=x.p)s[x.p]=1});return s};
  const hist=[];for(let i=30;i>=0;i--)hist.push({t:now-i*D,l:Math.round(12+(46-12)*(30-i)/30+(i%4===0?1:0))});
  const F=[
    mk({id:'F-0001',nom:'Famille Houngbo',quartier:'Akpakpa',volume:6,level:46,mine:true,battery:86,hist,history:[{date:now-690*D,vol:5.6,montant:38500,op:'Opérateur agréé C'}]}),
    mk({id:'F-0127',nom:'Cour Adjovi',quartier:'Vossa',volume:8,level:78}),
    mk({id:'F-0312',nom:'Résidence Tossou',quartier:'Agla',volume:6,level:91}),
    mk({id:'F-0455',nom:'Maison Dossou',quartier:'Fidjrossè',volume:4,level:55}),
    mk({id:'F-0231',nom:'Cour Agbo',quartier:'Godomey',volume:6,level:96}),
    mk({id:'F-0198',nom:'Maison Kpadé',quartier:'Cadjèhoun',volume:10,level:83}),
    mk({id:'F-0089',nom:'Maison Sossa',quartier:'Fidjrossè',volume:6,level:18}),
    mk({id:'F-0340',nom:'Cour Ahouandjinou',quartier:'Gbégamey',volume:8,level:67}),
    mk({id:'F-0402',nom:'Maison Zinsou',quartier:'Sainte-Rita',volume:6,level:34}),
    mk({id:'F-0518',nom:'Cour Hounkpè',quartier:'Missèbo',volume:10,level:88}),
    mk({id:'F-0263',nom:'Maison Ahyi',quartier:'Zogbo',volume:4,level:72}),
    mk({id:'F-0610',nom:'Résidence Codjia',quartier:'Houéyiho',volume:6,level:12}),
    mk({id:'F-0377',nom:'Cour Lokossou',quartier:'Akpakpa',volume:8,level:61}),
    mk({id:'F-0144',nom:'Maison Gbaguidi',quartier:'Vossa',volume:6,level:93})];

  return `<div class="c-head" style="margin-bottom:12px"><div class="fchips" role="group" aria-label="Filtrer">${fl.map(([k,l])=>`<button class="fchip" type="button" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}</div>
    <label class="search">${ico('search',16)}<span class="sr">Rechercher</span><input id="q" type="search" placeholder="Fosse, nom, quartier" value="${esc(S.q||'')}"></label></div>
  <div class="tbl"><table style="min-width:860px"><thead><tr><th>Fosse</th><th>Quartier</th><th>Niveau</th><th>Montant</th><th>Paiement</th><th>Statut</th><th>Échéance / passage</th><th>Action</th></tr></thead><tbody>${rows.map(f=>{const s=statusOf(f);return `<tr class="${f.mine?'hl':''}"><td>${idCell(f)}</td><td>${esc(f.quartier)}</td><td>${lvlBar(f)}</td><td class="num">${f.level>=50||f.pay?fcfa(f.pay?f.pay.montant:montant(f)):'—'}</td><td>${payLabel(f)}</td><td><span class="chip t-${s.tone}">${s.label}</span></td><td class="num" style="font-size:12.5px">${f.req&&f.req.status==='programmee'?f.req.slot.label:f.req?left(f.req.deadline):f.level>=90?'Prioritaire':'—'}</td><td>${actBtn(f)}</td></tr>`}).join('')||'<tr><td colspan="8"><div class="empty">Aucune fosse ne correspond.</div></td></tr>'}</tbody></table></div>`}

function vPlanning(){const pg=S.fosses.filter(f=>statusOf(f).k==='programmee').sort((a,b)=>a.req.slot.start-b.req.slot.start),aP=S.fosses.filter(f=>statusOf(f).k==='a_programmer').sort((a,b)=>a.req.deadline-b.req.deadline),urg=S.fosses.filter(f=>f.level>=90&&!f.req);
  const days={};pg.forEach(f=>{const k=dayLbl(f.req.slot.start);(days[k]=days[k]||[]).push(f)});
  const load=OPS.map(o=>[o,pg.filter(f=>f.req.vidangeur===o).length]),mx=Math.max(1,...load.map(x=>x[1]));
  return `<div class="two"><div class="stack">
    <div class="c white"><div class="c-head"><h3>${ico('truck',16)} Passages programmés</h3><span class="chip t-ok">${pg.length}</span></div>
      ${Object.entries(days).map(([d,L])=>`<div class="lbl" style="margin:14px 0 6px">${d.charAt(0).toUpperCase()+d.slice(1)}</div>${L.map(f=>`<div class="slot"><div class="hr num">${hm(f.req.slot.start)}<small>${hm(f.req.slot.start+2*H)}</small></div><div><b class="num">${f.id}</b> · ${esc(f.nom)} · ${esc(f.quartier)}<div class="meta">${esc(f.req.vidangeur)} · ${m3(f.volume*f.level/100)} · ${payLabel(f)}</div></div>${actBtn(f)}</div>`).join('')}`).join('')||'<p class="meta" style="margin-top:10px">Aucun passage programmé.</p>'}</div>
    <div class="c"><div class="c-head"><h3>À programmer sous 48 h</h3><span class="chip t-warn">${aP.length+urg.length}</span></div>
      <div class="stack" style="margin-top:12px">${[...aP,...urg].map(f=>`<div class="prio"><div><b class="num">${f.id}</b> · ${esc(f.quartier)}<div class="meta">${f.req?'Payé le '+dayLbl(f.req.createdAt)+' · '+left(f.req.deadline):'Urgence, non payée · solde au passage'}</div></div><span class="chip t-${tone(f.level)} num">${f.level} %</span>${actBtn(f)}</div>`).join('')||'<p class="meta">Toutes les demandes payées sont programmées.</p>'}</div></div></div>
  <div class="stack"><div class="c"><h3>Charge des opérateurs</h3><div style="margin-top:10px">${load.map(([o,n])=>`<div style="padding:7px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--ink)">${o}</span><span class="num meta">${n} passage${n>1?'s':''}</span></div><div class="pbar" style="margin-top:5px"><i style="width:${n/mx*100}%"></i></div></div>`).join('')}</div><p class="meta" style="margin:8px 0 0">Noms d'opérateurs fictifs.</p></div>
    <div class="c white"><h3>Vidanges réalisées</h3><div style="margin-top:6px">${S.done.slice(0,6).map(d=>`<div class="kv"><span>${dayLbl(d.t)} · <b class="num" style="color:var(--ink);font-weight:500">${d.id}</b> ${esc(d.quartier)}</span><span class="num">${m3(d.vol)}</span></div>`).join('')}</div><p class="meta" style="margin:8px 0 0">Volume déposé à la station de traitement.</p></div></div></div>`}

function vPay(){const F=S.fosses,P=F.filter(f=>f.pay),wait=F.filter(f=>f.level>=50&&!f.pay),{enc,reste}=money();
  return `<div class="kpis"><div class="kpi navy"><span class="tag">Encaissé</span><div><div class="v num" style="font-size:28px">${fcfa(enc)}</div><span class="meta">via mobile money</span></div></div><div class="kpi warn"><span class="tag">Tranches</span><div><div class="v num" style="font-size:28px">${fcfa(reste)}</div><span class="meta">reste à percevoir</span></div></div><div class="kpi ok"><span class="tag">Complets</span><div><div class="v num">${P.filter(fullyPaid).length}</div><span class="meta">paiements soldés</span></div></div><div class="kpi crit"><span class="tag">Sans paiement</span><div><div class="v num">${wait.length}</div><span class="meta">fosses en alerte non réglées</span></div></div></div>
  <div class="c-head" style="margin:18px 0 10px"><h3 style="font-size:18px;font-weight:500">Paiements en cours</h3></div>
  <div class="tbl"><table style="min-width:760px"><thead><tr><th>Fosse</th><th>Montant</th><th>Formule</th><th>Tranches</th><th>Reçu</th><th>Reste</th><th>Moyen</th><th>Action</th></tr></thead><tbody>${P.map(f=>`<tr class="${f.mine?'hl':''}"><td>${idCell(f)}</td><td class="num">${fcfa(f.pay.montant)}</td><td>${f.pay.mode===1?'En 1 fois':f.pay.mode+' tranches'}</td><td><span class="trs">${f.pay.tranches.map(t=>`<i class="${t.paid?'on':''}" title="${fcfa(t.montant)} · ${t.paid?'payé':'à payer'}"></i>`).join('')}</span></td><td class="num">${fcfa(paidSum(f))}</td><td class="num">${fcfa(f.pay.montant-paidSum(f))}</td><td>${esc(f.pay.operator)}</td><td>${fullyPaid(f)?'<span class="chip t-ok">Soldé</span>':`<button class="btn small" data-act="remind" data-id="${f.id}">Relancer</button>`}</td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">Aucun paiement.</div></td></tr>'}</tbody></table></div>
  <div class="c-head" style="margin:18px 0 10px"><h3 style="font-size:18px;font-weight:500">En alerte, pas encore de paiement</h3></div>
  <div class="tbl"><table style="min-width:620px"><thead><tr><th>Fosse</th><th>Quartier</th><th>Niveau</th><th>Montant dû</th><th>Action</th></tr></thead><tbody>${wait.sort((a,b)=>b.level-a.level).map(f=>`<tr class="${f.mine?'hl':''}"><td>${idCell(f)}</td><td>${esc(f.quartier)}</td><td>${lvlBar(f)}</td><td class="num">${fcfa(montant(f))}</td><td style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-act="remind" data-id="${f.id}">Relancer</button>${canProg(f)?`<button class="btn small primary" data-act="prog" data-id="${f.id}">Programmer</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">Toutes les fosses en alerte ont un paiement en cours.</div></td></tr>'}</tbody></table></div>`}

function vAlerts(){const fl=[['all','Toutes'],['crit','Urgences'],['warn','Seuils et tranches'],['ok','Paiements et passages']],k=S.af||'all';
  const L=S.feed.filter(e=>k==='all'||(k==='warn'?(e.tone==='warn'||e.tone==='high'):e.tone===k));
  if(S.gSeen!==S.feed.length){S.gSeen=S.feed.length;save()}
  return `<div class="fchips" role="group" aria-label="Filtrer les alertes" style="margin-bottom:12px">${fl.map(([v,l])=>`<button class="fchip" type="button" data-af="${v}" aria-pressed="${k===v}">${l}</button>`).join('')}</div>
  <div class="c white">${L.map(feedRow).join('')||'<p class="meta">Aucune alerte dans ce filtre.</p>'}</div>`}

function renderModal(){const Lr=document.getElementById('layer');if(!ui.modal){Lr.innerHTML='';return}const m=ui.modal,f=S.fosses.find(x=>x.id===m.id);if(!f){ui.modal=null;Lr.innerHTML='';return}
  let body;
  if(m.kind==='fiche'){const s=statusOf(f);body=`<div><span class="lbl">Fiche fosse</span><h2 id="mt" style="font-size:24px;font-weight:500;margin-top:6px">${f.id} · ${esc(f.nom)}</h2><p class="meta" style="font-size:13.5px;margin:6px 0 0">${esc(f.quartier)}, Cotonou · ${m3(f.volume)}</p></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="chip t-${s.tone}">${s.label}</span><div style="flex:1;min-width:160px">${lvlBar(f)}</div></div>
    <div><div class="kv"><span>Volume à vider</span><span class="num">${m3(f.volume*f.level/100)}</span></div><div class="kv"><span>Montant</span><span class="num">${f.level>=50||f.pay?fcfa(f.pay?f.pay.montant:montant(f)):'—'}</span></div><div class="kv"><span>Paiement</span><span>${payLabel(f)}${f.pay?' · '+esc(f.pay.operator):''}</span></div><div class="kv"><span>Alertes envoyées</span><span>${SEUILS.filter(x=>f.sent[x.p]).map(x=>x.p+' %').join(', ')||'aucune'}</span></div><div class="kv"><span>Passage</span><span>${f.req&&f.req.status==='programmee'?f.req.slot.label+' · '+esc(f.req.vidangeur):f.req?'À programmer · '+left(f.req.deadline):'—'}</span></div><div class="kv"><span>Capteur</span><span class="num">Batterie ${f.battery} % · GSM</span></div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="close">Fermer</button><span style="flex:1"></span>${actBtn(f)}</div>`}
  else body=`<div><span class="lbl">Programmer la vidange · ${f.id}</span><h2 id="mt" style="font-size:24px;font-weight:500;margin-top:6px">${esc(f.nom)} · ${esc(f.quartier)}</h2><p class="meta" style="font-size:13.5px;margin:6px 0 0">Niveau ${f.level} % · ${m3(f.volume*f.level/100)} · ${payLabel(f)}${!fullyPaid(f)?' · urgence, solde à régler au passage':''}</p></div>
  <div class="field"><label for="m-op">Vidangeur agréé</label><select id="m-op"><option value="">Choisir un opérateur</option>${OPS.map(o=>`<option ${m.op===o?'selected':''}>${o}</option>`).join('')}</select></div>
  <div class="field"><label for="m-slot">Créneau (dans les 48 h)</label><select id="m-slot"><option value="">Choisir un créneau</option>${slots().map(t=>`<option value="${t}" ${String(m.slot)===String(t)?'selected':''}>${slotLabel(t)}</option>`).join('')}</select></div>
  ${m.error?`<span class="err">${esc(m.error)}</span>`:''}<p class="meta" style="font-size:13px;margin:0">Le ménage reçoit la date et l'heure par notification et par SMS.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="close">Annuler</button><button class="btn primary" style="flex:1" data-act="prog-ok">Programmer et prévenir le ménage</button></div>`;
  Lr.innerHTML=`<div class="overlay" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${body}</div></div>`;
  (document.getElementById('m-op')||Lr.querySelector('.modal button')).focus()}

const TABS=[['over','Vue d\'ensemble','dash'],['fosses','Fosses','table'],['planning','Planning','truck'],['paiements','Paiements','pay'],['alertes','Alertes','alerts']];
const TITLES={over:'Supervision des vidanges',fosses:'Fosses connectées',planning:'Planning des passages',paiements:'Paiements',alertes:'Alertes reçues'};
const SUBS={over:'Grand Cotonou · mise à jour en direct',fosses:'Niveau, paiement et statut de chaque fosse',planning:'Vidanges à programmer sous 48 h après paiement',paiements:'Paiements en une fois ou par tranches',alertes:'Seuils, paiements et passages'};
function render(){const tab=S.gTab||'over',unread=Math.max(0,S.feed.length-(S.gSeen||0)),aP=S.fosses.filter(f=>statusOf(f).k==='a_programmer').length;
  const side=`<div class="brand"><span class="bi">${LOGO}</span><div>Supervision<small>Vidanges · SGDS</small></div></div>`+TABS.map(([k,l,i])=>`<button class="mi" type="button" data-gtab="${k}" ${tab===k?'aria-current="page"':''}>${ico(i)}<span class="lab">${l}</span>${k==='planning'&&aP?`<span class="cnt">${aP}</span>`:k==='alertes'&&unread&&tab!=='alertes'?'<span class="dot"></span>':''}</button>`).join('')+`<div class="user"><span class="avatar">AG</span><div><b>Agent de supervision</b><small>Centre de suivi · démo</small></div></div>`;
  const board={over:vOver,fosses:vFosses,planning:vPlanning,paiements:vPay,alertes:vAlerts}[tab]();
  const demo=S.demo?`<div class="demo"><span class="tag">Démo</span><span>Les paiements faits dans l'app ménage (fosse F-0001) arrivent ici en direct.</span><button class="btn blue small" type="button" data-act="plus">Capteur F-0001 +10 %</button><button class="btn small" type="button" data-act="reset">Réinitialiser</button><a href="menage.html" target="_blank" rel="noopener">Ouvrir l'app ménage ↗</a></div>`:'';
  document.getElementById('app').innerHTML=`<nav class="side" aria-label="Menu">${side}</nav><main class="main">
    <div class="topbar"><div><h1>${TITLES[tab]}</h1><span class="sub">${SUBS[tab]}</span></div>
      <div class="tb-r"><span class="chip t-info"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span> ${S.fosses.length} capteurs en ligne</span><button class="icon-btn" type="button" data-act="demo" aria-pressed="${!!S.demo}" aria-label="Afficher le bandeau de démo" title="Démo">${ico('chart',17)}</button><button class="icon-btn" type="button" data-gtab="alertes" aria-label="Alertes${unread?' ('+unread+' nouvelles)':''}">${ico('alerts',17)}${unread&&tab!=='alertes'?`<span class="cnt">${unread}</span>`:''}</button><span class="avatar" aria-hidden="true">AG</span></div></div>
    ${demo}${board}
    <div class="foot-note"><span>Maquette de démonstration · non officielle · données, opérateurs et tarifs fictifs</span><span>Les données restent dans ce navigateur</span></div></main>`;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-gtab],[data-act],[data-filter],[data-af]');if(!el)return;
  if(el.dataset.gtab){S.gTab=el.dataset.gtab;save();render();window.scrollTo(0,0);return}
  if(el.dataset.filter){S.filter=el.dataset.filter;save();render();return}
  if(el.dataset.af){S.af=el.dataset.af;save();render();return}
  const a=el.dataset.act,f=el.dataset.id&&S.fosses.find(x=>x.id===el.dataset.id);
  if(a==='plus'){const f0=mine();const m=setLevel(Math.min(100,f0.level+10));render();toast(m||'F-0001 : niveau '+f0.level+' %');return}
  if(a==='reset'){S=seed();ui.modal=null;save();renderModal();render();toast('Démo réinitialisée');return}
  if(a==='demo'){S.demo=!S.demo;save();render();return}
  if(a==='fiche'&&f){ui.modal={kind:'fiche',id:f.id};renderModal();return}
  if(a==='prog'&&f){ui.modal={kind:'prog',id:f.id,op:'',slot:'',error:''};renderModal();return}
  if(a==='done'&&f){done(f);ui.modal=null;renderModal();render();toast('Vidange enregistrée · capteur remis à zéro');return}
  if(a==='remind'&&f){remind(f);render();toast('Relance envoyée par SMS à '+f.nom);return}
  if(a==='close'||(a==='close-bg'&&e.target===el)){ui.modal=null;renderModal();return}
  if(a==='prog-ok'){const m=ui.modal,op=document.getElementById('m-op').value,sl=document.getElementById('m-slot').value;m.op=op;m.slot=sl;
    if(!op||!sl){m.error=!op?'Choisissez un vidangeur agréé.':'Choisissez un créneau dans les 48 h.';renderModal();return}
    program(S.fosses.find(x=>x.id===m.id),op,+sl);ui.modal=null;renderModal();render();toast('Vidange programmée · ménage prévenu par SMS')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pin')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('change',e=>{if(ui.modal&&(e.target.id==='m-op'||e.target.id==='m-slot')){ui.modal[e.target.id==='m-op'?'op':'slot']=e.target.value;ui.modal.error=''}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;save();const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;const n=S.feed.length;load();render();if(ui.modal)renderModal();if(S.feed.length>n&&S.feed[0])toast('Nouvelle alerte : '+S.feed[0].text)});
if(S.gSeen==null){S.gSeen=S.feed.length-2;save()}
render();
</script></body></html>
